# Builds the day's brief and emails subscribers, every morning.
# Runs on GitHub's free runners; settings come from the repo's Actions secrets
# (Settings -> Secrets and variables -> Actions). See README "Deploy".
name: Daily brief

on:
  schedule:
    # 00:30 UTC = 06:00 India time. GitHub may start scheduled runs a few minutes late.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email subscribers after building the brief"
        type: boolean
        default: false

# Never run two at once (e.g. a manual run during the scheduled one).
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    env:
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      # Unset EMAIL_TRANSPORT means "preview": nothing is sent.
      EMAIL_TRANSPORT: ${{ secrets.EMAIL_TRANSPORT }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # The embedding model (~70 MB) is downloaded once and reused.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: pipeline/data/models
          key: fastembed-bge-small-en-v1.5

      - name: Build today's brief
        run: python -m kernel.run

      - name: Email subscribers
        if: github.event_name == 'schedule' || inputs.send_email
        run: python -m kernel.send

      # Sundays (India time): the weekly digest for readers who chose weekly.
      - name: Weekly digest
        if: github.event_name == 'schedule' || inputs.send_email
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" = "7" ]; then python -m kernel.send --weekly; else echo "Not Sunday"; fi

      # Does nothing until TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets exist.
      - name: Post to Telegram
        if: github.event_name == 'schedule' || inputs.send_email
        run: python -m kernel.telegram
