name: Daily brief

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email subscribers after building the brief"
        type: boolean
        default: false

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    env:
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      EMAIL_TRANSPORT: ${{ secrets.EMAIL_TRANSPORT }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: pipeline/data/models
          key: fastembed-bge-small-en-v1.5

      - name: Build today's brief
        run: python -m kernel.run

      - name: Company blogs
        continue-on-error: true
        run: python -m kernel.company_blogs

      - name: Watch alerts
        continue-on-error: true
        run: python -m kernel.watches

      - name: Email subscribers
        if: github.event_name == 'schedule' || inputs.send_email
        run: python -m kernel.send

      - name: Weekly digest
        if: github.event_name == 'schedule' || inputs.send_email
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" = "7" ]; then python -m kernel.send --weekly; else echo "Not Sunday"; fi

      - name: Post to Telegram
        if: github.event_name == 'schedule' || inputs.send_email
        run: python -m kernel.telegram
